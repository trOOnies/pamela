<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>See you soon · Pamela</title>
  <!-- Everything is inline: the server stops right after sending this page. -->
  <link rel="icon" href="data:image/svg+xml,{{logo_url}}">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const t = localStorage.getItem("pamela-theme");
      if (t === "light" || t === "dark") document.querySelector('meta[name="color-scheme"]').content = t;
    } catch {}
  </script>
  <style>
    /* light-dark(light, dark); the theme toggle's pick comes in <meta name="color-scheme"> */
    :root {
      color-scheme: light dark;
      --bg: light-dark(#e7f0dc, #0e140c); --surface: light-dark(#fbfdf8, #151d12);
      --surface-2: light-dark(#e2edd5, #1e2919); --border: light-dark(#cad9ba, #2d3b27);
      --text: light-dark(#13200f, #ecf3e6); --text-2: light-dark(#475844, #b8c6b0); --text-3: light-dark(#6f7f69, #88977f);
      --accent: light-dark(#2f7d32, #6fbf62); --accent-soft: light-dark(#d9eecf, #213a1c);
      --accent-2: light-dark(#8a6d00, #e2c75a); --accent-2-line: light-dark(#d9bf45, #8d7a26); --accent-2-soft: light-dark(#fbf3c8, #332d12);
      --sun: light-dark(#f4d44d, #e2c75a); --radius: 14px;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
    }
    :root:has(> head > meta[name="color-scheme"][content="light"]) { color-scheme: light; }
    :root:has(> head > meta[name="color-scheme"][content="dark"]) { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background:
        radial-gradient(60rem 30rem at 50% -8rem, color-mix(in srgb, var(--sun) 28%, transparent), transparent 70%),
        var(--bg);
      color: var(--text);
    }
    main {
      width: 100%; max-width: 480px; text-align: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px 28px 26px; box-shadow: 0 1px 2px rgb(0 0 0 / .06);
    }
    .logo { display: block; margin: 0 auto 6px; width: 84px; height: 84px; }
    .logo .rays { transform-origin: 32px 41px; animation: set 1.6s ease-in 0.4s both; }
    @keyframes set { to { opacity: 0; transform: translateY(6px) scale(.85); } }
    @media (prefers-reduced-motion: reduce) { .logo .rays { animation: none; } }
    h1 { font-size: 1.6rem; margin: 0 0 6px; }
    .line { color: var(--text-2); margin: 0 0 18px; font-size: 1.05rem; }
    .tally {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none;
    }
    .tally li {
      background: var(--accent-soft); color: var(--text); border-radius: 999px; padding: 4px 12px; font-size: .92rem;
    }
    .tally li b { color: var(--accent); }
    .saved {
      background: var(--accent-2-soft); border: 1px solid var(--accent-2-line); border-radius: 10px;
      padding: 10px 14px; margin: 0 0 16px; color: var(--text); font-size: .95rem;
    }
    .hint { color: var(--text-3); margin: 0; font-size: .9rem; }
    code { background: var(--surface-2); border-radius: 6px; padding: 1px 6px; font-size: .9em; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Pamela">
      <g class="rays" stroke="#e3b81f" stroke-width="3.4" stroke-linecap="round">
        <path d="M32 7v6"/><path d="M14.6 14.6l4 4"/><path d="M49.4 14.6l-4 4"/>
      </g>
      <path d="M15 41a17 17 0 0 1 34 0z" fill="#f4d44d"/>
      <path d="M22 31a11.5 11.5 0 0 1 9-6.5" fill="none" stroke="#fbf3c8" stroke-width="3" stroke-linecap="round"/>
      <path d="M2 47c10-10.5 50-12.5 60-3.5-6 10.5-50 14.5-60 3.5z" fill="#7cc46a"/>
      <path d="M7.5 47.5c15-4.5 36-6 50-4" fill="none" stroke="#2f7d32" stroke-width="1.8" stroke-linecap="round" opacity=".5"/>
      <path d="M15.6 37.6h32.8" stroke="#2f7d32" stroke-width="4.6" stroke-linecap="round"/>
      <path d="M47.6 37.6c4.6.6 8.2 3 10 7.6" fill="none" stroke="#2f7d32" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>{{greeting}}</h1>
    <p class="line">{{line}}</p>
    {{tally}}
    <p class="saved">🌱 Everything is saved, and Pamela's server has stopped.</p>
    <p class="hint">You can close this tab. To open Pamela again, run <code>make serve</code>.</p>
  </main>
</body>
</html>
