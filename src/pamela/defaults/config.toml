# Pamela - manual configuration
#
# This file lives in info/config.toml and is meant to be edited by hand.
# Changes are picked up automatically on the next request (no restart needed).
# Over time these settings will move into the app itself.

[profile]
name = "Me"
# Body weight in kg, used to estimate calories burned from an activity's MET value
# when you don't enter the calories yourself.
weight_kg = 75.0

# Daily targets: intake, steps and hours of sleep.
[targets]
kcal = 2200
protein_g = 150
carbs_g = 230
fat_g = 70
fiber_g = 30
steps = 8000
sleep_h = 8

# Meals shown in the daily log, in this order.
[meals]
names = ["Breakfast", "Lunch", "Snack", "Dinner"]

# Activity types are managed in the app (Settings tab), no longer here.
